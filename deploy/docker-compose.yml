# Example stack: deploy-gateway behind Traefik.
# Copy this file and .env.example (renamed to .env) into one folder and adjust the values in .env.
services:
  deploy-gateway:
    image: ghcr.io/sebbi08/deployment-gateway:${GATEWAY_VERSION:?set GATEWAY_VERSION in .env}
    container_name: deploy-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      # Must be the identical absolute path on the host and in the container.
      WORKSPACES_ROOT: ${GATEWAY_DIR:?set GATEWAY_DIR in .env}/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ${GATEWAY_DIR}/workspaces:${GATEWAY_DIR}/workspaces
      # Registry credentials of the host (inline `auths`, no credsStore); the file must exist.
      - ${DOCKER_CONFIG_FILE:?set DOCKER_CONFIG_FILE in .env}:/docker/config.json:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    labels:
      traefik.enable: true
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      # Agent endpoint (MCP + JSON API).
      traefik.http.routers.deploy-gateway-mcp.rule: Host(`${MCP_HOST:?set MCP_HOST in .env}`)
      traefik.http.routers.deploy-gateway-mcp.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.deploy-gateway-mcp.service: deploy-gateway-mcp
      traefik.http.services.deploy-gateway-mcp.loadbalancer.server.port: 8080
      # Admin UI.
      traefik.http.routers.deploy-gateway-admin.rule: Host(`${ADMIN_HOST:?set ADMIN_HOST in .env}`)
      traefik.http.routers.deploy-gateway-admin.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.deploy-gateway-admin.service: deploy-gateway-admin
      traefik.http.services.deploy-gateway-admin.loadbalancer.server.port: 8081
      # Optional: put a forward-auth middleware (Authelia, oauth2-proxy, ...) in front of the admin UI.
      # traefik.http.routers.deploy-gateway-admin.middlewares: my-forward-auth@docker
      # Add tls / certresolver labels here if your entrypoint does not enable TLS by default.
    networks:
      - proxy
networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
