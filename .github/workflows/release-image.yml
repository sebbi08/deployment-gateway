name: Release image

# Manually triggered: builds and pushes ghcr.io/<owner>/<repo>:<version>
# and tags the built commit as v<version>. Existing versions are never
# overwritten.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version and branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::releases are built from main only, not $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Go vet and test
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the v<version> git tag
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${repo}" >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Refuse to overwrite an existing release
        # Fail closed: only a clear "not found" counts as absent; any other
        # registry or git error stops the release.
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION already exists"
            exit 1
          elif ! grep -qi "not found" <<<"$out"; then
            echo "::error::cannot check whether $IMAGE:$VERSION exists: $out"
            exit 1
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null
          rc=$?
          set -e
          case $rc in
            0) echo "::error::git tag v$VERSION already exists"; exit 1 ;;
            2) ;; # no such tag
            *) echo "::error::cannot check the git tags (git ls-remote exit $rc)"; exit 1 ;;
          esac

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Summary
        run: echo "Pushed \`$IMAGE:$VERSION\` and tagged \`v$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
