name: Release image

# Manually triggered: builds and pushes ghcr.io/<owner>/<repo>:<version>
# and tags the built commit as v<version>. Existing versions are never
# overwritten.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go vet and test
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the v<version> git tag
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${repo}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Refuse to overwrite an existing release
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::git tag v$VERSION already exists"
            exit 1
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Summary
        run: echo "Pushed \`$IMAGE:$VERSION\` and tagged \`v$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
